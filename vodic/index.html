  var LANGS = ['hr', 'en', 'de', 'pl', 'cs'];
  var STORAGE_KEY = 'jadranka-lang'; // same key as the main site
  var lang = 'hr';

  function t(key) { var e = T[key]; if (!e) return ''; return e[LANGS.indexOf(lang)] || e[0]; }

  function pickLang() {
    var saved = null;
    try { saved = localStorage.getItem(STORAGE_KEY); } catch (e) {}
    if (saved && LANGS.indexOf(saved) > -1) return saved;
    var nav = (navigator.languages || [navigator.language || 'hr']);
    for (var i = 0; i < nav.length; i++) {
      var code = String(nav[i]).slice(0, 2).toLowerCase();
      if (LANGS.indexOf(code) > -1) return code;
      if (code === 'sk') return 'cs';
    }
    return 'en';
  }

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function renderWifi() {
    var box = document.getElementById('wifi-cards');
    var html = '';
    ['stan', 'istok'].forEach(function (id) {
      var w = WIFI[id];
      html += '<div class="card"><h3>' + esc(t('wifi_apt_' + id)) + '</h3>';
      if (w.ssid && w.pass) {
        html += '<div class="wifi-row"><span class="muted">' + esc(t('wifi_net')) + '</span><code>' + esc(w.ssid) + '</code></div>';
        html += '<div class="wifi-row"><span class="muted">' + esc(t('wifi_pass')) + '</span><code>' + esc(w.pass) + '</code>' +
                '<button class="btn copy" data-copy="' + esc(w.pass) + '">' + esc(t('wifi_copy')) + '</button></div>';
      } else {
        html += '<p class="muted">' + esc(t('wifi_missing')) + '</p>';
      }
      html += '</div>';
    });
    box.innerHTML = html;
    box.querySelectorAll('[data-copy]').forEach(function (b) {
      b.addEventListener('click', function () {
        var done = function () { b.textContent = t('wifi_copied'); setTimeout(function () { b.textContent = t('wifi_copy'); }, 2000); };
        if (navigator.clipboard) navigator.clipboard.writeText(b.getAttribute('data-copy')).then(done, done); else done();
      });
    });
  }

  function apply(l) {
    lang = l;
    document.documentElement.lang = l;
    try { localStorage.setItem(STORAGE_KEY, l); } catch (e) {}
    document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = t(el.getAttribute('data-t')); });
    document.querySelectorAll('[data-lang]').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-lang') === l); });
    document.title = t('eyebrow') + ' | Apartmani Jadranka Mimice';
    renderWifi();
  }

  document.querySelectorAll('[data-lang]').forEach(function (b) {
    b.addEventListener('click', function () { apply(b.getAttribute('data-lang')); });
  });
  apply(pickLang());
  </script>
