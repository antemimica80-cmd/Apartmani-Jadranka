name: Sync Airbnb Calendars

# Refreshes data/availability-stan.json and
# availability-istok.json once a day from each apartment's Airbnb iCal
# export, so the booking calendars on the site always reflect current
# availability without any manual updates.
#
# ONE-TIME SETUP (repeat per apartment):
#   1. In Airbnb, go to Hosting -> the listing (Stan or Istok) -> Calendar ->
#      Availability settings -> Sync calendars -> Export calendar, and copy
#      the "Export Calendar" (iCal) URL.
#   2. In this repo, go to Settings -> Secrets and variables -> Actions ->
#      New repository secret, and paste the URL as:
#        - AIRBNB_ICAL_STAN  for the Stan listing
#        - AIRBNB_ICAL_ISTOK for the Istok listing
#   3. That's it — this workflow will start populating the matching
#      availability-<unit>.json on its next scheduled run, or trigger it
#      manually via the Actions tab ("Run workflow") to sync immediately.
#      Each apartment syncs independently — you don't need both secrets set
#      at once.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch Stan calendar
        env:
          AIRBNB_ICAL_URL: ${{ secrets.AIRBNB_ICAL_STAN }}
          OUTPUT_PATH: data/availability-stan.json
        run: |
          if [ -z "$AIRBNB_ICAL_URL" ]; then
            echo "AIRBNB_ICAL_STAN secret is not set yet — skipping Stan sync."
          else
            node scripts/sync-airbnb-ical.mjs
          fi

      - name: Fetch Istok calendar
        env:
          AIRBNB_ICAL_URL: ${{ secrets.AIRBNB_ICAL_ISTOK }}
          OUTPUT_PATH: data/availability-istok.json
        run: |
          if [ -z "$AIRBNB_ICAL_URL" ]; then
            echo "AIRBNB_ICAL_ISTOK secret is not set yet — skipping Istok sync."
          else
            node scripts/sync-airbnb-ical.mjs
          fi

      - name: Commit updated availability
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/availability-stan.json data/availability-istok.json; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git add data/availability-stan.json data/availability-istok.json
            git commit -m "Sync Airbnb availability"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A push made with the default GITHUB_TOKEN does not itself trigger
      # other workflows (GitHub's loop-prevention), so the Pages deploy
      # would otherwise stay stale until someone re-runs it by hand —
      # trigger it explicitly whenever this sync actually changed the data.
      - name: Trigger site redeploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-pages.yml --ref main
